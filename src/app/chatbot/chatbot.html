@if (isOpen) {
  <div class="chat-container">
    <div class="chat-header">
      <span>ibticare agent</span>
      <button class="chat-toggle-btn" (click)="toggleChat()">−</button>
    </div>
    
    <div #scrollContainer class="chat-messages">
      @for (msg of messages; track msg) {
        <div class="message" [ngClass]="msg.isBot ? 'bot' : 'user'">
          {{ msg.text }}
        </div>
      }
    </div>
    
    <div class="chat-input-area">
      <input #chatInput (keyup.enter)="sendMessage(chatInput)" type="text" placeholder="Type a command..." class="chat-input" />
      <button class="chat-send" (click)="sendMessage(chatInput)">Send</button>
    </div>
  </div>
} @else {
  <button class="chat-launcher" (click)="toggleChat()">
    💬
  </button>
}
